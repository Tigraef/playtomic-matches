name: Playtomic-Matches sichern

on:
  schedule:
    - cron: "17 4 * * *" # täglich ca. 06:17 Uhr MESZ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-matches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Matches abrufen
        env:
          PLAYTOMIC_EMAIL: ${{ secrets.PLAYTOMIC_EMAIL }}
          PLAYTOMIC_PASSWORD: ${{ secrets.PLAYTOMIC_PASSWORD }}
        run: python scripts/fetch_matches.py

      - name: Änderungen committen
        run: |
          git add data/matches.json
          if git diff --cached --quiet; then
            echo "Keine neuen Matches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Matches aktualisiert ($(date -u +%Y-%m-%d))"
          git push
